networks:
  public:
  internal:
    internal: false   # 🔐 NOT accessible from host

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"       # 🌍 ONLY public entry point
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - public
      - internal
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build: ./FrontEnd
    container_name: react-frontend
    networks:
      - internal     # Internal only, accessed through nginx
    environment:
      - REACT_APP_API_URL=http://nginx/api
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ./BackEnd
    container_name: node-api
    networks:
      - internal     # 🔒 internal only
    ports:
      - "5000:5000"       # 🌍 ONLY public entry point
    environment:
      - OLLAMA_URL=http://ollama:11434
      - AI_SERVICE_URL=http://ai-service:8000
      - PORT=5000
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    container_name: ollama
    networks:
      - public
    ports:
      - "11434:11434"
    restart: unless-stopped
    volumes:
      - ./LLM_FineTunning:/root/.ollama/models
      - ./LLM_FineTunning/autoscript.sh:/autoscript.sh
    post_start:
      - command: ["sh", "-c", "/autoscript.sh"]
  
  ai-service:
    build: ./AI_Service
    container_name: ai-service
    networks:
      - internal
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MCP_SERVER_URL=http://mcp:8080/sse
      - OLLAMA_MODEL=llama3.2:latest
    depends_on:
      - ollama
      - mcp
    restart: unless-stopped

  mcp:
    build: ./MCP
    container_name: mcp
    networks:
      - internal
    ports:
      - "8080:8080"
    restart: unless-stopped

