networks:
  public:
  internal:
    internal: true

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - public
      - internal
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build: ./FrontEnd
    container_name: react-frontend
    networks:
      - internal
    expose:
      - "3000"
    environment:
      - REACT_APP_API_URL=http://nginx/api
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ./BackEnd
    container_name: node-api
    networks:
      - internal
    expose:
      - "5000"
    environment:
      - OLLAMA_URL=http://ollama_minibot:11434
      - AI_SERVICE_URL=http://ai-service:8000
      - PORT=5000
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    container_name: ollama_minibot
    networks:
      - internal
    expose:
      - "11434"
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama
    container_name: ollama_init_minibot
    networks:
      - internal
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama_minibot:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
    volumes:
      - ./LLM_FineTunning/autoscript.sh:/autoscript.sh:ro
    entrypoint: ["sh", "/autoscript.sh"]
    restart: "no"

  ai-service:
    build: ./AI_Service
    container_name: ai-service
    networks:
      - internal
    expose:
      - "8000"
    environment:
      - OLLAMA_HOST=http://ollama_minibot:11434
      - MCP_SERVER_URL=http://mcp:8080/sse
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build: ./MCP
    container_name: mcp
    networks:
      - internal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/sse', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  # redis:
  #   image: redis:7-alpine
  #   container_name: redis
  #   networks:
  #     - internal
  #   restart: unless-stopped

volumes:
  ollama_data:
